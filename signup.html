<body class="page-auth">
  <!-- Splash Screen -->
  <div id="splash-screen" class="splash-screen hidden">
    <div class="splash-logo">📔</div>
    <h1 class="splash-text">MyJournal+</h1>
    <div class="splash-bar">
      <div class="splash-bar-fill"></div>
    </div>
    <p class="splash-subtitle">Create your account today</p>
  </div>

  <main class="auth-container glass" role="main">
    <header class="logo-block">
      <img src="logo.png" alt="MyJournal+ logo" class="site-logo" />
      <h1 class="logo-title">MyJournal+</h1>
      <p class="site-desc">Create your private diary - your thoughts are safe and organized</p>
    </header>

    <form id="signup-form" class="auth-form" aria-label="Sign up form">
      <label class="input-label">Username</label>
      <input id="signup-username" type="text" required placeholder="Your display name" />

      <label class="input-label">Age</label>
      <select id="signup-age" required><option value="">Select age</option></select>

      <label class="input-label">Gender</label>
      <select id="signup-gender" required>
        <option value="">Select gender</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="non-binary">Non-binary</option>
        <option value="prefer-not">Prefer not</option>
        <option value="other">Other</option>
      </select>

      <label class="input-label">Email</label>
      <input id="signup-email" type="email" required placeholder="you@example.com" />

      <label class="input-label">Password</label>
      <div class="password-row">
        <input id="signup-password" type="password" required placeholder="Choose a password (min 6 chars)" />
        <button type="button" id="signup-showpass" class="show-pass">Show</button>
      </div>

     <button id="signup-btn" class="btn primary" type="submit"
        style="margin-top:12px; width:100%; text-align:center;">
    Sign up</button>

</form>

    <div class="oauth-divider">Or sign up with</div>

    <div id="google-signup-button" style="display:flex; justify-content:center;"></div>

    <div class="auth-links" style="justify-content:flex-end">
      <div>Already have an account? <a href="login" class="link" style="color:var(--accent-2);">Sign in</a></div>
    </div>

     <footer style="width:95%;display:inline;justify-content:space-between;text-align:center;align-items:center;margin-top:10px">
      <div><a href="about" class="tiny-link">About</a> · <a href="terms" class="tiny-link">Terms</a> · <a href="privacy" class="tiny-link">Privacy</a> </br> <a href="https://www.appcreator24.com/app3925490-pv2y17">Download Android App </a> </div> 
      <div class="app-footer">Celma - 2026</div>
    </footer>

  </main>
