<script>
(function(){try{var g=localStorage.getItem('mj_theme_active');if(!g)return;var p=JSON.parse(g);var t=p.theme||'default',b=p.bgStyle||'gradient';
document.documentElement.dataset.mjTheme=t;document.documentElement.dataset.mjBg=b;
var css='body.theme-ready{}';
// apply classes as soon as body exists
function apply(){var body=document.body;if(!body)return;['theme-midnight','theme-sunset','theme-forest','theme-rose','theme-ocean','theme-aurora','theme-ember','theme-lavender','theme-slate','bg-style-gradient','bg-style-mesh','bg-style-solid','bg-style-waves','bg-style-noir'].forEach(function(c){body.classList.remove(c)});if(t&&t!=='default')body.classList.add('theme-'+t);body.classList.add('bg-style-'+b);}
if(document.body)apply();else document.addEventListener('DOMContentLoaded',apply);
}catch(e){}})();
</script>

<body>
  <header class="app-header glass">
    <div class="header-left">
      <h1 class="logo-title">MyJournal+</h1>
      <p class="site-desc small">Write and format your entry</p>
    </div>
    <div class="header-right">
      <a href="home" class="btn">Back</a>
 <button id="save-entry" class="btn primary">Save</button>
    </div>
  </header>

  <main class="editor-page glass" role="main">

    <!-- Top toolbar row: Themes + AI + Tags + Premium CTA -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div style="display:flex;gap:8px;align-items:center">
        <button id="theme-toggle" class="btn small" title="Themes">Apply 🎨 Themes</button>
        <div id="theme-palette" style="display:none;gap:8px;flex-wrap:wrap;justify-content:flex-start;padding:12px;border-radius:12px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04)"></div>
      </div>

    </div>
 <input id="entry-title" class="editor-title" placeholder="Title" aria-label="Entry title" />
    <div class="editor-toolbar" role="toolbar" aria-label="Formatting toolbar">
      <!-- Block formats -->
      <div class="tool-group">
        <select id="block-format" title="Format">
          <option value="P">Body</option>
          <option value="H1">H1</option>
          <option value="H2">H2</option>
          <option value="H3">H3</option>
          <option value="H4">H4</option>
        </select>
      </div>

      <!-- Inline styles -->
      <div class="tool-group">
        <button data-cmd="bold" title="Bold"><b>B</b></button>
        <button data-cmd="italic" title="Italic"><i>I</i></button>
        <button data-cmd="underline" title="Underline"><u>U</u></button>
        <button data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
      </div>

      <!-- Lists + indent -->
      <div class="tool-group">
        <button data-cmd="insertUnorderedList" title="Bulleted list">•</button>
        <button id="ordered-list-btn" title="Numbered list">1.</button>
        <button id="lettered-list-btn" title="Lettered list">a)</button>
        <button data-cmd="outdent" title="Decrease indent">◀</button>
        <button data-cmd="indent" title="Increase indent">▶</button>
      </div>

      <!-- Alignment -->
      <div class="tool-group">
        <button data-cmd="justifyLeft" title="Align left">L</button>
        <button data-cmd="justifyCenter" title="Align center">C</button>
        <button data-cmd="justifyRight" title="Align right">R</button>
      </div>

      <!-- Color -->
      <div class="tool-group">
        <input id="color-picker" type="color" title="Text color" />
      </div>
       
      
      </div>
    </div>

    <div id="entry-content" class="entry-editor" contenteditable="true" spellcheck="true" aria-label="Entry content" aria-placeholder="Write your thoughts here..."></div>
  </main>

  <footer style="width:95%;display:inline;justify-content:space-between;text-align:center;align-items:center;margin-top:10px">
